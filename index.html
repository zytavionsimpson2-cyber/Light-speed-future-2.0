<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Speed Future 2.0 ⚡</title>
</head>

<body>
  <h1>Light Speed Future 2.0 ⚡</h1>
  <p>Your personal AI assistant.</p>

  <input id="question" placeholder="Ask me anything..." />
  <button onclick="askAI()">Ask</button>

  <p id="answer">I'm online! ⚡</p>

  <script>
    function askAI() {
      const question = document.getElementById("question").value;
      const answer = document.getElementById("answer");

      if (!question) {
        answer.textContent = "Ask me something!";
        return;
      }

      answer.textContent =
        "You asked: " + question + " ⚡ Light Speed Future is thinking...";
    }
  </script>
</body>
</html>
