<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Light Speed Future 2.0</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #status {
      text-align: center;
      color: #8cff8c;
      margin-bottom: 20px;
    }

    #chat {
      min-height: 400px;
      max-height: 60vh;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      background: #15151c;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .user {
      color: #6db7ff;
    }

    .ai {
      color: #8cff8c;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111118;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Light Speed Future 2.0 ⚡</h1>

    <div id="status">Loading AI...</div>

    <div id="chat"></div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Ask Light Speed Future something..."
      >

      <button id="sendButton">Send</button>
    </div>

  </div>

  <script type="module">

    import { pipeline } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

    let generator = null;

    /*
      This array is Light Speed Future's conversation memory.

      Every user message and every AI answer is saved here.
    */
    const messages = [
      {
        role: "system",
        content:
          "You are Light Speed Future, a personal AI assistant. " +
          "You remember information the user has told you earlier in the conversation. " +
          "Use the previous messages to answer questions about the user. " +
          "If the user says their name is Z and later asks what their name is, answer Z. " +
          "Answer the user's actual question directly. " +
          "For simple questions, use one short sentence. " +
          "Do not repeat the question. " +
          "Do not ask what the user thinks."
      }
    ];

    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");


    function addMessage(sender, text) {

      const message = document.createElement("div");

      message.className = "message";

      if (sender === "You") {
        message.innerHTML =
          `<strong class="user">You:</strong> ${text}`;
      } else {
        message.innerHTML =
          `<strong class="ai">Light Speed Future:</strong> ${text}`;
      }

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    async function loadAI() {

      try {

        status.textContent = "Loading AI...";

        generator = await pipeline(
          "text-generation",
          "onnx-community/Qwen2.5-0.5B-Instruct"
        );

        status.textContent = "I'm online! ⚡";

      } catch (error) {

        console.error(error);

        status.textContent = "AI failed to load.";

      }
    }


    async function askAI() {

      const text = input.value.trim();

      if (!text || !generator) {
        return;
      }

      input.value = "";

      sendButton.disabled = true;

      addMessage("You", text);

      /*
        Save the user's message to memory.
      */
      messages.push({
        role: "user",
        content: text
      });


      try {

        /*
          Give the AI the ENTIRE conversation history.
        */
        const prompt =
          generator.tokenizer.apply_chat_template(
            messages,
            {
              tokenize: false,
              add_generation_prompt: true
            }
          );


        const result = await generator(prompt, {

          max_new_tokens: 40,

          temperature: 0.1,

          do_sample: true,

          return_full_text: false

        });


        let answer = result[0].generated_text;


        if (Array.isArray(answer)) {

          answer =
            answer[answer.length - 1]?.content || "";

        }


        if (typeof answer !== "string") {

          answer = String(answer || "");

        }


        answer = answer.trim();


        answer = answer
          .replace(/<\|im_start\|>/g, "")
          .replace(/<\|im_end\|>/g, "")
          .replace(/<\|endoftext\|>/g, "")
          .trim();


        if (answer.includes("A:")) {

          answer =
            answer.split("A:").pop().trim();

        }


        /*
          Remove accidental question repetition.
        */
        if (
          answer.toLowerCase().startsWith(text.toLowerCase())
        ) {

          answer =
            answer.substring(text.length).trim();

        }


        /*
          Save the AI's answer to conversation memory.
        */
        messages.push({
          role: "assistant",
          content: answer
        });


        addMessage("AI", answer);


      } catch (error) {

        console.error(error);

        addMessage(
          "AI",
          "I couldn't generate an answer. Please try again."
        );

      }


      sendButton.disabled = false;

      input.focus();

    }


    sendButton.addEventListener(
      "click",
      askAI
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          askAI();

        }

      }
    );


    loadAI();

  </script>

</body>
</html>
