<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Speed Future 2.0 ⚡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    #chat {
      height: 60vh;
      min-height: 400px;
      overflow-y: auto;
      background: #15151f;
      border: 1px solid #292938;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #24244f;
    }

    .ai {
      background: #202029;
    }

    .label {
      font-weight: bold;

      display: flex;

    }

    #input {
      flex: 1;

    }

      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>Light Speed Future 2.0 ⚡</h1>

    <div id="status">Starting Light Speed Future...</div>

    <div id="chat"></div>

    <div class="input-row">
      <input
        id="input"
        type="text"
        placeholder="Ask Light Speed Future something..."
        disabled
      >

      <button id="sendButton" disabled>Send</button>
    </div>

    <button id="clearButton">🗑️ Clear Memory</button>
  </div>

  <script type="module">

    import { pipeline, TextStreamer } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

    const MODEL = "onnx-community/Qwen2.5-0.5B-Instruct";

    const MAX_TOKENS = 48;

    const status = document.getElementById("status");
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");

    let generator = null;
    let modelReady = false;
    let isGenerating = false;

    const memoryKey = "lightSpeedMemory";
    const factsKey = "lightSpeedFacts";

    let conversationMemory =
      JSON.parse(localStorage.getItem(memoryKey) || "[]");

    let savedFacts =
      JSON.parse(localStorage.getItem(factsKey) || "{}");


    function saveMemory() {
      localStorage.setItem(
        memoryKey,
        JSON.stringify(conversationMemory)
      );
    }


    function saveFacts() {
      localStorage.setItem(
        factsKey,
        JSON.stringify(savedFacts)
      );
    }


    function addMessage(sender, text, type) {

      const message = document.createElement("div");
      message.className = "message " + type;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = sender + ":";

      const content = document.createElement("div");
      content.textContent = text;

      message.appendChild(label);
      message.appendChild(content);

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      return content;
    }


    function rememberFact(text) {

      const match = text.match(
        /^my\s+(.+?)\s+is\s+(.+)$/i
      );

      if (!match) {
        return;
      }

      const key = match[1].trim().toLowerCase();
      const value = match[2].trim();

      savedFacts[key] = value;

      saveFacts();
    }


    function findSavedFact(text) {

      const match = text.match(
        /^what(?:'s| is)\s+my\s+(.+?)\??$/i
      );

      if (!match) {
        return null;
      }

      const key = match[1].trim().toLowerCase();

      if (savedFacts[key]) {
        return savedFacts[key];
      }

      return null;
    }


    function addConversationToMemory(userText, aiText) {

      conversationMemory.push({
        role: "user",
        content: userText
      });

      conversationMemory.push({
        role: "assistant",
        content: aiText
      });

      if (conversationMemory.length > 12) {
        conversationMemory =
          conversationMemory.slice(-12);
      }

      saveMemory();
    }


    function buildMessages(userText) {

      const systemPrompt =
        "You are Light Speed Future 2.0. " +
        "Answer the user's question accurately and directly. " +
        "Give a short complete answer, usually 1 to 3 sentences. " +
        "Finish your sentence before stopping. " +
        "Do not ramble, repeat yourself, or add unnecessary details.";

      const messages = [
        {
          role: "system",
          content: systemPrompt
        }
      ];

      for (const item of conversationMemory) {
        messages.push(item);
      }

      messages.push({
        role: "user",
        content: userText
      });

      return messages;
    }


    function finishGeneration() {

      isGenerating = false;

      if (modelReady) {
        input.disabled = false;
        sendButton.disabled = false;
        status.textContent = "AI ready ⚡";
        input.focus();
      }
    }


    async function loadAI() {

      try {

        status.textContent =
          "Starting Light Speed Future...";

        generator = await pipeline(
          "text-generation",
          MODEL,
          {
            dtype: "q8"
          }
        );

        modelReady = true;

        status.textContent = "AI ready ⚡";

        input.disabled = false;
        sendButton.disabled = false;

        input.focus();

      } catch (error) {

        console.error(error);

        status.textContent =
          "AI failed to start. Refresh the page.";

        input.disabled = true;
        sendButton.disabled = true;
      }
    }


    async function askAI(userText) {

      if (!generator || !modelReady || isGenerating) {
        return;
      }

      isGenerating = true;

      input.disabled = true;
      sendButton.disabled = true;

      status.textContent = "Light Speed Future is thinking...";

      const aiContent =
        addMessage(
          "Light Speed Future",
          "",
          "ai"
        );

      try {

        const messages =
          buildMessages(userText);

        const streamer =
          new TextStreamer(
            generator.tokenizer,
            {
              skip_prompt: true,
              callback_function: (text) => {

                aiContent.textContent += text;

                chat.scrollTop =
                  chat.scrollHeight;
              }
            }
          );

        const generated =
          await generator(messages, {
            max_new_tokens: MAX_TOKENS,
            do_sample: false,
            streamer: streamer
          });

        /*
          Fallback in case streaming does not
          produce visible text.
        */
        if (
          aiContent.textContent.trim() === "" &&
          Array.isArray(generated)
        ) {

          const result =
            generated[0]?.generated_text;

          if (Array.isArray(result)) {

            const lastMessage =
              result[result.length - 1];

            if (
              lastMessage &&
              typeof lastMessage.content === "string"
            ) {

              aiContent.textContent =
                lastMessage.content.trim();
            }

          } else if (
            typeof result === "string"
          ) {

            aiContent.textContent =
              result.trim();
          }
        }

        let finalAnswer =
          aiContent.textContent.trim();

        if (!finalAnswer) {
          finalAnswer =
            "I couldn't generate an answer. Please try again.";
          aiContent.textContent = finalAnswer;
        }

        addConversationToMemory(
          userText,
          finalAnswer
        );

      } catch (error) {

        console.error(error);

        aiContent.textContent =
          "Something went wrong while generating the answer.";

      } finally {

        finishGeneration();
      }
    }


    async function handleSend() {

      const userText =
        input.value.trim();

      if (
        !userText ||
        !modelReady ||
        isGenerating
      ) {
        return;
      }

      input.value = "";

      addMessage(
        "You",
        userText,
        "user"
      );

      rememberFact(userText);

      const savedAnswer =
        findSavedFact(userText);

      if (savedAnswer !== null) {

        addMessage(
          "Light Speed Future",
          savedAnswer,
          "ai"
        );

        addConversationToMemory(
          userText,
          savedAnswer
        );

        return;
      }

      await askAI(userText);
    }


    sendButton.addEventListener(
      "click",
      handleSend
    );


    input.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          event.preventDefault();
          handleSend();
        }

      }
    );


    clearButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          memoryKey
        );

        localStorage.removeItem(
          factsKey
        );

        conversationMemory = [];
        savedFacts = {};

        chat.innerHTML = "";

        addMessage(
          "Light Speed Future",
          "Memory cleared. ⚡",
          "ai"
        );

        input.focus();
      }
    );


    addMessage(
      "Light Speed Future",
      "Hello! I'm Light Speed Future 2.0. ⚡",
      "ai"
    );


    loadAI();

  </script>

</body>
</html>
