<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Light Speed Future 2.0 ⚡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 25px 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 30px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #chat {
      min-height: 350px;
      max-height: 60vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      color: #4da6ff;
    }

    .ai {
      color: #00ff99;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 13px 17px;
      border: none;
      border-radius: 8px;
      background: #00cc88;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00ee99;
    }

    button:disabled,
    #input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #clearMemory {
      display: block;
      margin: 12px auto 0;
      background: #333;
      color: white;
    }

    #clearMemory:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Light Speed Future 2.0 ⚡</h1>

    <div id="status">
      Starting Light Speed Future...
    </div>

    <div id="chat"></div>

    <div class="controls">

      <input
        id="input"
        type="text"
        placeholder="Ask Light Speed Future..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

    <button id="clearMemory">
      🗑️ Clear Memory
    </button>

  </div>

  <script type="module">

    import {
      pipeline,
      TextStreamer
    } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


    // =========================================================
    // MODEL / SPEED
    // =========================================================

    const MODEL =
      "onnx-community/Qwen2.5-0.5B-Instruct";

    // Enough room for complete answers without excessive output.
    const MAX_TOKENS = 40;


    // =========================================================
    // ELEMENTS
    // =========================================================

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("input");

    const sendButton =
      document.getElementById("sendButton");

    const clearMemoryButton =
      document.getElementById("clearMemory");

    const status =
      document.getElementById("status");


    // =========================================================
    // MEMORY
    // =========================================================

    let messages = [
      {
        role: "system",
        content:
          "You are Light Speed Future 2.0. " +
          "Answer the user's question directly and accurately. " +
          "Be concise but finish your answer. " +
          "Do not ramble or repeat yourself."
      }
    ];

    let savedFacts = {};


    // =========================================================
    // LOAD CONVERSATION MEMORY
    // =========================================================

    try {

      const storedMemory =
        JSON.parse(
          localStorage.getItem(
            "lightSpeedMemory"
          )
        );

      if (
        Array.isArray(storedMemory) &&
        storedMemory.length > 0
      ) {

        messages = storedMemory;

      }

    } catch (error) {

      console.log(
        "Memory could not be loaded."
      );

    }


    // =========================================================
    // LOAD SAVED FACTS
    // =========================================================

    try {

      const storedFacts =
        JSON.parse(
          localStorage.getItem(
            "lightSpeedFacts"
          )
        );

      if (
        storedFacts &&
        typeof storedFacts === "object"
      ) {

        savedFacts = storedFacts;

      }

    } catch (error) {

      console.log(
        "Facts could not be loaded."
      );

    }


    // =========================================================
    // STATE
    // =========================================================

    let generator = null;

    let modelReady = false;

    let isGenerating = false;


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHTML(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    // =========================================================
    // ADD MESSAGE
    // =========================================================

    function addMessage(type, text) {

      const message =
        document.createElement("div");

      message.className =
        "message";

      if (type === "User") {

        message.innerHTML =
          `<strong class="user">You:</strong> ` +
          escapeHTML(text);

      } else {

        message.innerHTML =
          `<strong class="ai">Light Speed Future:</strong> ` +
          escapeHTML(text);

      }

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;

    }


    // =========================================================
    // SHOW SAVED CONVERSATION
    // =========================================================

    function showConversation() {

      chat.innerHTML = "";

      const visible =
        messages.filter(
          message =>
            message.role === "user" ||
            message.role === "assistant"
        );

      for (const message of visible) {

        if (message.role === "user") {

          addMessage(
            "User",
            message.content
          );

        } else {

          addMessage(
            "AI",
            message.content
          );

        }

      }

    }


    showConversation();


    // =========================================================
    // SAVE MEMORY
    // =========================================================

    function saveMemory() {

      try {

        localStorage.setItem(
          "lightSpeedMemory",
          JSON.stringify(messages)
        );

      } catch (error) {

        console.log(
          "Could not save memory."
        );

      }

    }


    // =========================================================
    // SAVE FACTS
    // =========================================================

    function saveFacts() {

      try {

        localStorage.setItem(
          "lightSpeedFacts",
          JSON.stringify(savedFacts)
        );

      } catch (error) {

        console.log(
          "Could not save facts."
        );

      }

    }


    // =========================================================
    // REMEMBER FACT
    // =========================================================

    function rememberFact(text) {

      const match =
        text.match(
          /^my\s+(.+?)\s+is\s+(.+)$/i
        );

      if (!match) {

        return false;

      }

      const key =
        match[1]
          .trim()
          .toLowerCase();

      const value =
        match[2]
          .trim();

      if (!key || !value) {

        return false;

      }

      savedFacts[key] =
        value;

      saveFacts();

      return true;

    }


    // =========================================================
    // FIND SAVED FACT
    // =========================================================

    function findSavedFact(text) {

      const match =
        text.match(
          /^what(?:'s| is)\s+my\s+(.+?)[?!.]*$/i
        );

      if (!match) {

        return null;

      }

      const key =
        match[1]
          .trim()
          .toLowerCase();

      if (savedFacts[key]) {

        return (
          `Your ${key} is ` +
          `${savedFacts[key]}.`
        );

      }

      return null;

    }


    // =========================================================
    // LOAD AI
    // =========================================================

    async function loadAI() {

      status.textContent =
        "Loading AI...";

      try {

        generator =
          await pipeline(
            "text-generation",
            MODEL,
            {
              dtype: "q8"
            }
          );

        modelReady = true;

        status.textContent =
          "AI ready ⚡";

        input.disabled = false;

        sendButton.disabled = false;

        input.focus();

      } catch (error) {

        console.error(error);

        status.textContent =
          "AI failed to load. Refresh and try again.";

      }

    }


    // =========================================================
    // UNLOCK EVERYTHING
    // =========================================================

    function finishGeneration() {

      isGenerating = false;

      input.disabled = false;

      sendButton.disabled = false;

      sendButton.textContent =
        "Send";

      status.textContent =
        "AI ready ⚡";

      input.focus();

    }


    // =========================================================
    // ASK AI
    // =========================================================

    async function askAI() {

      if (isGenerating) {

        return;

      }


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      isGenerating = true;

      input.disabled = true;

      sendButton.disabled = true;

      sendButton.textContent =
        "Thinking...";

      input.value = "";


      // Show question immediately
      addMessage(
        "User",
        text
      );


      // Save question
      messages.push({
        role: "user",
        content: text
      });

      saveMemory();


      // =======================================================
      // SAVE A FACT
      // =======================================================

      if (rememberFact(text)) {

        const answer =
          "Got it. I'll remember that.";

        addMessage(
          "AI",
          answer
        );

        messages.push({
          role: "assistant",
          content: answer
        });

        saveMemory();

        finishGeneration();

        return;

      }


      // =======================================================
      // ANSWER FROM MEMORY
      // =======================================================

      const savedAnswer =
        findSavedFact(text);


      if (savedAnswer) {

        addMessage(
          "AI",
          savedAnswer
        );

        messages.push({
          role: "assistant",
          content: savedAnswer
        });

        saveMemory();

        finishGeneration();

        return;

      }


      // =======================================================
      // AI NOT READY
      // =======================================================

      if (!modelReady || !generator) {

        const answer =
          "I'm still loading. Try again in a moment.";

        addMessage(
          "AI",
          answer
        );

        messages.push({
          role: "assistant",
          content: answer
        });

        saveMemory();

        finishGeneration();

        return;

      }


      // =======================================================
      // CREATE STREAMING RESPONSE
      // =======================================================

      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message";

      aiMessage.innerHTML =
        `<strong class="ai">Light Speed Future:</strong> ` +
        `<span class="answer"></span>`;

      chat.appendChild(
        aiMessage
      );


      const answerElement =
        aiMessage.querySelector(
          ".answer"
        );


      let answer = "";


      try {

        // =====================================================
        // STREAM TOKENS
        // =====================================================

        const streamer =
          new TextStreamer(
            generator.tokenizer,
            {
              skip_prompt: true,

              callback_function:
                token => {

                  answer += token;

                  answerElement.textContent =
                    answer;

                  chat.scrollTop =
                    chat.scrollHeight;

                }
            }
          );


        // =====================================================
        // GENERATE
        // =====================================================

        const output =
          await generator(
            messages,
            {
              max_new_tokens:
                MAX_TOKENS,

              do_sample:
                false,

              streamer:
                streamer
            }
          );


        // =====================================================
        // FALLBACK
        // =====================================================

        if (!answer.trim()) {

          try {

            const generated =
              output?.[0]?.generated_text;


            if (
              Array.isArray(generated)
            ) {

              const last =
                generated[
                  generated.length - 1
                ];


              if (last?.content) {

                answer =
                  last.content;

              }

            } else if (
              typeof generated === "string"
            ) {

              answer =
                generated;

            }

          } catch (error) {

            console.log(
              "Fallback failed."
            );

          }

        }


        answer =
          String(answer || "")
            .trim();


        // =====================================================
        // MAKE SURE ANSWER IS COMPLETE
        // =====================================================

        if (!answer) {

          answer =
            "I couldn't generate an answer. Try again.";

        }


        answerElement.textContent =
          answer;


        // Save response
        messages.push({
          role: "assistant",
          content: answer
        });

        saveMemory();


      } catch (error) {

        console.error(error);

        answerElement.textContent =
          "Something went wrong. Try again.";

      } finally {

        finishGeneration();

      }

    }


    // =========================================================
    // SEND BUTTON
    // =========================================================

    sendButton.addEventListener(
      "click",
      askAI
    );


    // =========================================================
    // ENTER KEY
    // =========================================================

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          askAI();

        }

      }
    );


    // =========================================================
    // CLEAR MEMORY
    // =========================================================

    clearMemoryButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "lightSpeedMemory"
        );

        localStorage.removeItem(
          "lightSpeedFacts"
        );


        messages = [
          {
            role: "system",
            content:
              "You are Light Speed Future 2.0. " +
              "Answer the user's question directly and accurately. " +
              "Be concise but finish your answer. " +
              "Do not ramble or repeat yourself."
          }
        ];


        savedFacts = {};


        chat.innerHTML = "";


        status.textContent =
          "Memory cleared ⚡";


        input.focus();

      }
    );


    // =========================================================
    // START AI
    // =========================================================

    input.disabled = true;

    sendButton.disabled = true;

    loadAI();

  </script>

</body>
</html>
