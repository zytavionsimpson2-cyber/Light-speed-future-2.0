
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Speed Future 2.0 ⚡</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .app {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin: 10px;
    }

    #chat {
      height: 60vh;
      overflow-y: auto;
      background: #181818;
      border-radius: 12px;
      padding: 15px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .user {
      background: #292929;
    }

    .ai {
      background: #202020;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #question {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #181818;
      color: white;
      font-size: 16px;
    }

    #send {
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #send:active {
      transform: scale(0.96);
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Light Speed Future 2.0 ⚡</h1>

  <div id="status">Starting AI...</div>

  <div id="chat"></div>

  <div class="controls">
    <input
      id="question"
      type="text"
      placeholder="Ask Light Speed Future..."
      autocomplete="off"
    >

    <button id="send" type="button">Send</button>
  </div>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const question = document.getElementById("question");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const status = document.getElementById("status");

let generator = null;
let loading = true;
let thinking = false;

const messages = [
  {
    role: "system",
    content:
      "You are Light Speed Future, a helpful personal AI assistant. " +
      "Answer the user's question directly and clearly. " +
      "Give the answer first, then a short explanation if needed. " +
      "Keep responses concise and easy to understand. " +
      "Do not repeat the user's question. " +
      "Do not add unnecessary words or rambling. " +
      "If you know the answer, answer confidently. " +
      "If you do not know, say you do not know. " +
      "Never invent facts. " +
      "For complicated tasks, give simple numbered steps."
  }
];
function addMessage(name, text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = name + ": " + text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

async function startAI() {

  try {

    status.textContent = "Loading AI... first startup may take a little while.";

    generator = await pipeline(
      "text-generation",
     "onnx-community/Qwen2.5-0.5B-Instruct"
    );

    loading = false;

    status.textContent = "Light Speed Future is online! ⚡";

    question.disabled = false;
    send.disabled = false;

    question.focus();

  } catch (error) {

    console.error(error);

    loading = false;

    status.textContent =
      "AI failed to load. Refresh the page and try again.";

  }
}

async function askAI() {

    if (loading || thinking) return;

  const text = question.value.trim();

  if (!text) return;

  thinking = true;
  send.disabled = true;
  question.disabled = true;
  question.value = "";

  addMessage("You", text, "user");

  status.textContent = "Thinking... ⚡";

  messages.push({
    role: "user",
    content: text
  });

  try {

  const prompt =
  "You are Light Speed Future, a helpful AI assistant.\n" +
  "Answer the user's question directly and accurately.\n" +
  "Keep the answer short and clear.\n\n" +
  "User: " + text + "\n" +
  "Assistant:";

    const result = await generator(prompt, {
  max_new_tokens: 40,
  temperature: 0.7,
  do_sample: true
});

 let answer = result[0].generated_text;

if (Array.isArray(answer)) {
  answer = answer[answer.length - 1]?.content || "";
}

if (typeof answer !== "string") {
  answer = String(answer || "");
}

answer = answer.trim();

const stopWords = [
  "Question:",
  "Answer:",
  "User:",
  "Assistant:",
  "Here’s",
  "Here's",
  "Question"
];

for (const word of stopWords) {
  const index = answer.indexOf(word);

  if (index > 0) {
    answer = answer.substring(0, index).trim();
  }
}

    if (!answer) {
      answer = "I couldn't generate an answer. Please try again.";
    }

    addMessage(
      "Light Speed Future",
      answer,
      "ai"
    );

    messages.push({
      role: "assistant",
      content: answer
    });

    status.textContent =
      "Light Speed Future is online! ⚡";

  } catch (error) {

    console.error(error);

    addMessage(
      "Light Speed Future",
      "I couldn't generate an answer. Please try again.",
      "ai"
    );

    status.textContent =
      "Ready — try your question again.";

  }

  thinking = false;
  send.disabled = false;
  question.disabled = false;
  question.focus();

}


send.addEventListener("click", askAI);

question.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    askAI();

  }

});

question.disabled = true;
send.disabled = true;

startAI();

</script>

</body>
</html>
