<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Light Speed Future 2.0</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #status {
      text-align: center;
      color: #8cff8c;
      margin-bottom: 20px;
    }

    #chat {
      min-height: 400px;
      max-height: 60vh;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      background: #15151c;
      margin-bottom: 15px;
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .user {
      color: #6db7ff;
    }

    .ai {
      color: #8cff8c;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111118;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #clearMemory {
      background: #22222b;
      color: white;
      border: 1px solid #444;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Light Speed Future 2.0 ⚡</h1>

    <div id="status">Loading AI...</div>

    <div id="chat"></div>

    <div class="controls">

      <button id="clearMemory">
        🗑️ Clear Memory
      </button>

    </div>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Ask Light Speed Future something..."
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>


  <script type="module">

    import { pipeline } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


    let generator = null;


    /*
      LOAD SAVED MEMORY
    */

    let messages = [];

    const savedMemory =
      localStorage.getItem("lightSpeedMemory");


    if (savedMemory) {

      try {

        messages = JSON.parse(savedMemory);

      } catch (error) {

        messages = [];

      }

    }


    /*
      CREATE SYSTEM INSTRUCTIONS
      IF THERE IS NO MEMORY
    */

    function createNewMemory() {

      return [

        {
          role: "system",

          content:
            "You are Light Speed Future, a personal AI assistant. " +

            "Only use facts directly provided by the user " +
            "or clearly stated in the conversation. " +

            "Never invent personal information. " +

            "Never guess the user's name, birthday, age, " +
            "location, favorite things, family, or other facts. " +

            "If the user says their favorite color is blue, " +
            "remember that their favorite color is blue. " +

            "If the user later asks their favorite color, " +
            "answer that their favorite color is blue. " +

            "Do not create facts that were never provided. " +

            "Answer the actual question directly. " +

            "For simple questions, use one short sentence. " +

            "Do not repeat the question."
        }

      ];

    }


    if (
      !Array.isArray(messages) ||
      messages.length === 0
    ) {

      messages =
        createNewMemory();

    }


    const chat =
      document.getElementById("chat");


    const status =
      document.getElementById("status");


    const input =
      document.getElementById("userInput");


    const sendButton =
      document.getElementById("sendButton");


    const clearMemory =
      document.getElementById("clearMemory");


    /*
      SAVE MEMORY
    */

    function saveMemory() {

      localStorage.setItem(
        "lightSpeedMemory",
        JSON.stringify(messages)
      );

    }


    /*
      DISPLAY A MESSAGE
    */

    function addMessage(sender, text) {

      const message =
        document.createElement("div");


      message.className =
        "message";


      if (sender === "You") {

        message.innerHTML =
          `<strong class="user">You:</strong> ${text}`;

      } else {

        message.innerHTML =
          `<strong class="ai">Light Speed Future:</strong> ${text}`;

      }


      chat.appendChild(message);


      chat.scrollTop =
        chat.scrollHeight;

    }


    /*
      DISPLAY SAVED CHAT
    */

    function loadChat() {

      chat.innerHTML = "";


      for (const message of messages) {

        if (message.role === "user") {

          addMessage(
            "You",
            message.content
          );

        }


        if (message.role === "assistant") {

          addMessage(
            "AI",
            message.content
          );

        }

      }

    }


    /*
      CLEAR MEMORY BUTTON
    */

    clearMemory.addEventListener(
      "click",
      function() {

        localStorage.removeItem(
          "lightSpeedMemory"
        );


        messages =
          createNewMemory();


        chat.innerHTML = "";


        status.textContent =
          "Memory cleared! ⚡";


        setTimeout(
          function() {

            status.textContent =
              "I'm online! ⚡";

          },
          1500
        );

      }
    );


    /*
      LOAD AI
    */

    async function loadAI() {

      try {

        status.textContent =
          "Loading AI...";


        generator =
          await pipeline(
            "text-generation",
            "onnx-community/Qwen2.5-0.5B-Instruct"
          );


        status.textContent =
          "I'm online! ⚡";


        loadChat();


      } catch (error) {

        console.error(error);


        status.textContent =
          "AI failed to load.";

      }

    }


    /*
      ASK AI
    */

    async function askAI() {

      const text =
        input.value.trim();


      if (!text || !generator) {

        return;

      }


      input.value = "";


      sendButton.disabled = true;


      addMessage(
        "You",
        text
      );


      /*
        SAVE USER MESSAGE
      */

      messages.push({

        role: "user",

        content: text

      });


      saveMemory();


      try {

        /*
          SEND THE CONVERSATION
          TO THE AI
        */

        const prompt =
          generator.tokenizer.apply_chat_template(
            messages,
            {
              tokenize: false,
              add_generation_prompt: true
            }
          );


        const result =
          await generator(
            prompt,
            {

              max_new_tokens: 40,

              temperature: 0.05,

              do_sample: true,

              return_full_text: false

            }
          );


        let answer =
          result[0].generated_text;


        if (Array.isArray(answer)) {

          answer =
            answer[
              answer.length - 1
            ]?.content || "";

        }


        if (typeof answer !== "string") {

          answer =
            String(answer || "");

        }


        answer =
          answer.trim();


        /*
          REMOVE MODEL MARKERS
        */

        answer =
          answer
            .replace(
              /<\|im_start\|>/g,
              ""
            )
            .replace(
              /<\|im_end\|>/g,
              ""
            )
            .replace(
              /<\|endoftext\|>/g,
              ""
            )
            .trim();


        /*
          REMOVE A:
          IF THE MODEL ADDS IT
        */

        if (answer.includes("A:")) {

          answer =
            answer
              .split("A:")
              .pop()
              .trim();

        }


        /*
          SAVE AI RESPONSE
        */

        messages.push({

          role: "assistant",

          content: answer

        });


        saveMemory();


        addMessage(
          "AI",
          answer
        );


      } catch (error) {

        console.error(error);


        addMessage(
          "AI",
          "I couldn't generate an answer. Please try again."
        );

      }


      sendButton.disabled =
        false;


      input.focus();

    }


    /*
      SEND BUTTON
    */

    sendButton.addEventListener(
      "click",
      askAI
    );


    /*
      ENTER KEY
    */

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          askAI();

        }

      }
    );


    /*
      START AI
    */

    loadAI();

  </script>

</body>
</html>
