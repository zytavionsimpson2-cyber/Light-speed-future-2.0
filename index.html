```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Speed Future 2.0 ⚡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    #chat {
      height: 60vh;
      min-height: 400px;
      overflow-y: auto;
      background: #15151f;
      border: 1px solid #292938;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #24244f;
    }

    .ai {
      background: #202029;
    }

    .label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #20202b;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #sendButton {
      background: white;
      color: #111;
    }

    #clearButton {
      margin-top: 10px;
      width: 100%;
      background: #292936;
      color: white;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Light Speed Future 2.0 ⚡</h1>

    <div id="status">
      Starting Light Speed Future...
    </div>

    <div id="chat"></div>

    <div class="input-row">

      <input
        id="input"
        type="text"
        placeholder="Ask Light Speed Future something..."
        disabled
      >

      <button id="sendButton" disabled>
        Send
      </button>

    </div>

    <button id="clearButton">
      🗑️ Clear Memory
    </button>

  </div>


  <script type="module">

    /*
      =====================================================
      LIGHT SPEED FUTURE 2.0
      BACKGROUND AI WORKER
      =====================================================
    */

    const status =
      document.getElementById("status");

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("input");

    const sendButton =
      document.getElementById("sendButton");

    const clearButton =
      document.getElementById("clearButton");


    /*
      =====================================================
      MEMORY
      =====================================================
    */

    const memoryKey =
      "lightSpeedMemory";

    const factsKey =
      "lightSpeedFacts";


    let conversationMemory =
      JSON.parse(
        localStorage.getItem(memoryKey) || "[]"
      );


    let savedFacts =
      JSON.parse(
        localStorage.getItem(factsKey) || "{}"
      );


    function saveMemory() {

      localStorage.setItem(
        memoryKey,
        JSON.stringify(conversationMemory)
      );

    }


    function saveFacts() {

      localStorage.setItem(
        factsKey,
        JSON.stringify(savedFacts)
      );

    }


    /*
      =====================================================
      CHAT UI
      =====================================================
    */

    function addMessage(
      sender,
      text,
      type
    ) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;


      const label =
        document.createElement("div");

      label.className =
        "label";

      label.textContent =
        sender + ":";


      const content =
        document.createElement("div");

      content.textContent =
        text;


      message.appendChild(label);

      message.appendChild(content);

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;


      return content;
    }


    /*
      =====================================================
      FACT MEMORY
      =====================================================
    */

    function rememberFact(text) {

      const match =
        text.match(
          /^my\s+(.+?)\s+is\s+(.+)$/i
        );


      if (!match) {
        return;
      }


      const key =
        match[1]
          .trim()
          .toLowerCase();


      const value =
        match[2].trim();


      savedFacts[key] =
        value;


      saveFacts();

    }


    function findSavedFact(text) {

      const match =
        text.match(
          /^what(?:'s| is)\s+my\s+(.+?)\??$/i
        );


      if (!match) {
        return null;
      }


      const key =
        match[1]
          .trim()
          .toLowerCase();


      if (savedFacts[key]) {

        return savedFacts[key];

      }


      return null;

    }


    /*
      =====================================================
      CONVERSATION MEMORY
      =====================================================
    */

    function addConversationToMemory(
      userText,
      aiText
    ) {

      conversationMemory.push({

        role: "user",

        content: userText

      });


      conversationMemory.push({

        role: "assistant",

        content: aiText

      });


      if (
        conversationMemory.length > 12
      ) {

        conversationMemory =
          conversationMemory.slice(-12);

      }


      saveMemory();

    }


    /*
      =====================================================
      CREATE BACKGROUND WORKER
      =====================================================
    */

    const workerCode = `

      import {
        pipeline,
        TextStreamer
      } from
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


      const MODEL =
        "onnx-community/Qwen2.5-0.5B-Instruct";


      let generator = null;


      self.onmessage =
        async function(event) {

          const data = event.data;


          if (data.type === "load") {

            try {

              self.postMessage({
                type: "status",
                text: "Loading AI model..."
              });


              generator =
                await pipeline(
                  "text-generation",
                  MODEL,
                  {
                    dtype: "q8"
                  }
                );


              self.postMessage({
                type: "ready"
              });


            } catch (error) {

              self.postMessage({
                type: "error",
                text:
                  "The AI model could not start."
              });

              console.error(error);

            }

            return;
          }


          if (
            data.type === "generate"
          ) {

            if (!generator) {

              self.postMessage({
                type: "error",
                text: "AI is not ready yet."
              });

              return;

            }


            try {

              const streamer =
                new TextStreamer(
                  generator.tokenizer,
                  {

                    skip_prompt: true,

                    callback_function:
                      (text) => {

                        self.postMessage({
                          type: "token",
                          text: text
                        });

                      }

                  }
                );


              await generator(
                data.messages,
                {

                  max_new_tokens: 48,

                  do_sample: false,

                  streamer: streamer

                }
              );


              self.postMessage({
                type: "done"
              });


            } catch (error) {

              console.error(error);


              self.postMessage({
                type: "error",
                text:
                  "Something went wrong while generating the answer."
              });

            }

          }

        };

    `;


    const workerBlob =
      new Blob(
        [workerCode],
        {
          type: "text/javascript"
        }
      );


    const workerURL =
      URL.createObjectURL(workerBlob);


    const aiWorker =
      new Worker(
        workerURL,
        {
          type: "module"
        }
      );


    /*
      =====================================================
      WORKER STATE
      =====================================================
    */

    let modelReady = false;

    let isGenerating = false;

    let currentAIContent = null;


    /*
      =====================================================
      WORKER MESSAGES
      =====================================================
    */

    aiWorker.onmessage =
      function(event) {

        const data =
          event.data;


        if (
          data.type === "status"
        ) {

          status.textContent =
            data.text;

          return;

        }


        if (
          data.type === "ready"
        ) {

          modelReady = true;

          status.textContent =
            "AI ready ⚡";

          input.disabled =
            false;

          sendButton.disabled =
            false;

          input.focus();

          return;

        }


        if (
          data.type === "token"
        ) {

          if (currentAIContent) {

            currentAIContent.textContent +=
              data.text;

            chat.scrollTop =
              chat.scrollHeight;

          }

          return;

        }


        if (
          data.type === "done"
        ) {

          const finalAnswer =
            currentAIContent
              ? currentAIContent.textContent.trim()
              : "";


          if (
            finalAnswer
          ) {

            addConversationToMemory(
              currentUserText,
              finalAnswer
            );

          }


          finishGeneration();

          return;

        }


        if (
          data.type === "error"
        ) {

          if (currentAIContent) {

            currentAIContent.textContent =
              data.text;

          } else {

            addMessage(
              "Light Speed Future",
              data.text,
              "ai"
            );

          }


          finishGeneration();

        }

      };


    /*
      =====================================================
      CURRENT QUESTION
      =====================================================
    */

    let currentUserText = "";


    /*
      =====================================================
      FINISH
      =====================================================
    */

    function finishGeneration() {

      isGenerating =
        false;

      currentAIContent =
        null;

      input.disabled =
        false;

      sendButton.disabled =
        false;

      status.textContent =
        "AI ready ⚡";

      input.focus();

    }


    /*
      =====================================================
      BUILD MESSAGES
      =====================================================
    */

    function buildMessages(
      userText
    ) {

      const messages = [

        {

          role: "system",

          content:
            "You are Light Speed Future 2.0. " +
            "Answer accurately and directly. " +
            "Give a short complete answer, usually 1 to 3 sentences. " +
            "Do not ramble or repeat yourself."

        }

      ];


      for (
        const item of conversationMemory
      ) {

        messages.push(item);

      }


      messages.push({

        role: "user",

        content: userText

      });


      return messages;

    }


    /*
      =====================================================
      ASK AI
      =====================================================
    */

    async function askAI(
      userText
    ) {

      if (
        !modelReady ||
        isGenerating
      ) {

        return;

      }


      isGenerating =
        true;


      input.disabled =
        true;

      sendButton.disabled =
        true;


      status.textContent =
        "Light Speed Future is thinking...";


      currentAIContent =
        addMessage(
          "Light Speed Future",
          "",
          "ai"
        );


      currentUserText =
        userText;


      aiWorker.postMessage({

        type: "generate",

        messages:
          buildMessages(userText)

      });

    }


    /*
      =====================================================
      SEND
      =====================================================
    */

    async function handleSend() {

      const userText =
        input.value.trim();


      if (
        !userText ||
        !modelReady ||
        isGenerating
      ) {

        return;

      }


      input.value =
        "";


      addMessage(
        "You",
        userText,
        "user"
      );


      rememberFact(
        userText
      );


      const savedAnswer =
        findSavedFact(
          userText
        );


      if (
        savedAnswer !== null
      ) {

        addMessage(
          "Light Speed Future",
          savedAnswer,
          "ai"
        );


        addConversationToMemory(
          userText,
          savedAnswer
        );


        return;

      }


      await askAI(
        userText
      );

    }


    /*
      =====================================================
      BUTTON
      =====================================================
    */

    sendButton.addEventListener(
      "click",
      handleSend
    );


    /*
      =====================================================
      ENTER KEY
      =====================================================
    */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          handleSend();

        }

      }
    );


    /*
      =====================================================
      CLEAR MEMORY
      =====================================================
    */

    clearButton.addEventListener(
      "click",
      function() {

        localStorage.removeItem(
          memoryKey
        );


        localStorage.removeItem(
          factsKey
        );


        conversationMemory =
          [];


        savedFacts =
          {};


        chat.innerHTML =
          "";


        addMessage(
          "Light Speed Future",
          "Memory cleared. ⚡",
          "ai"
        );


        input.focus();

      }
    );


    /*
      =====================================================
      START
      =====================================================
    */

    addMessage(
      "Light Speed Future",
      "Hello! I'm Light Speed Future 2.0. ⚡",
      "ai"
    );


    aiWorker.postMessage({
      type: "load"
    });

  </script>

</body>
</html>
